<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='12' fill='%231f6049'/%3E%3Cpath d='M33 13 27 29 15 35 21 19Z' fill='white'/%3E%3C/svg%3E">
  <title>南京旅行手册</title>
  <style>
    :root {
      --ink: #15110e;
      --paper: #fff7e8;
      --line: rgba(255,247,232,.18);
      --red: #c84a2f;
      --gold: #c3913e;
      --green: #25705f;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--ink);
      color: var(--paper);
      font-family: "Songti SC", "Noto Serif CJK SC", "Source Han Serif SC", "STSong", serif;
    }

    body {
      display: grid;
      grid-template-rows: auto 1fr;
    }

    .shell {
      position: relative;
      z-index: 3;
      display: grid;
      grid-template-columns: minmax(180px, 1fr) auto minmax(180px, 1fr);
      align-items: center;
      gap: 18px;
      padding: 14px clamp(14px, 3vw, 30px);
      border-bottom: 1px solid var(--line);
      background:
        linear-gradient(90deg, rgba(21,17,14,.96), rgba(32,24,18,.9)),
        repeating-linear-gradient(90deg, rgba(255,247,232,.035) 0 1px, transparent 1px 5px);
      box-shadow: 0 18px 40px rgba(0,0,0,.28);
    }

    .brand {
      min-width: 0;
    }

    .brand b {
      display: block;
      font-size: 18px;
      line-height: 1.1;
      letter-spacing: .08em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .brand span,
    .status {
      display: block;
      margin-top: 4px;
      color: rgba(255,247,232,.62);
      font-size: 12px;
      letter-spacing: .08em;
    }

    .tabs {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px;
      border: 1px solid rgba(255,247,232,.18);
      border-radius: 999px;
      background: rgba(255,247,232,.08);
    }

    .tab {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 38px;
      padding: 0 16px;
      border: 0;
      border-radius: 999px;
      color: rgba(255,247,232,.7);
      background: transparent;
      cursor: pointer;
      font: inherit;
      white-space: nowrap;
      transition: background .22s ease, color .22s ease, transform .22s ease;
    }

    .tab:hover {
      color: var(--paper);
      transform: translateY(-1px);
    }

    .tab.active {
      color: var(--ink);
      background: var(--paper);
      box-shadow: 0 10px 28px rgba(0,0,0,.24);
    }

    .status {
      text-align: right;
      margin-top: 0;
    }

    .frame-wrap {
      position: relative;
      min-height: 0;
      background: #0f0c0a;
    }

    iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: var(--paper);
    }

    .fallback {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 4;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 38px;
      padding: 0 13px;
      border-radius: 999px;
      border: 1px solid rgba(255,247,232,.18);
      background: rgba(21,17,14,.68);
      color: rgba(255,247,232,.76);
      text-decoration: none;
      font-size: 13px;
      backdrop-filter: blur(12px);
    }

    @media (max-width: 780px) {
      .shell {
        grid-template-columns: 1fr;
        gap: 10px;
        padding: 12px;
      }

      .brand b,
      .brand span,
      .status {
        text-align: center;
      }

      .tabs {
        justify-self: center;
        max-width: 100%;
        overflow-x: auto;
        scrollbar-width: none;
      }

      .tabs::-webkit-scrollbar { display: none; }

      .tab {
        min-height: 36px;
        padding: 0 13px;
      }

      .fallback {
        display: none;
      }
    }
  </style>
</head>
<body>
  <header class="shell">
    <div class="brand">
      <b>南京旅行手册</b>
      <span>南京示例 · 3.5 天 · 信息非实时</span>
    </div>
    <nav class="tabs" aria-label="页面切换">
      <button class="tab active" type="button" data-page="map.html">路线图</button>
      <button class="tab" type="button" data-page="city-impression.html">城市印象</button>
      <button class="tab" type="button" data-page="food.html">美食路线</button>
    </nav>
    <a class="status" href="../" style="text-decoration:none">← Marco Polo</a>
  </header>

  <main class="frame-wrap">
    <iframe id="viewer" src="./map.html" title="南京旅行页面"></iframe>
    <a class="fallback" id="openDirect" href="./map.html" target="_blank" rel="noopener noreferrer">新窗口打开</a>
  </main>

  <script>
    const tabs = document.querySelectorAll(".tab");
    const viewer = document.getElementById("viewer");
    const openDirect = document.getElementById("openDirect");

    const allowed = ['map.html', 'food.html', 'city-impression.html'];
    const initial = new URLSearchParams(location.search).get('page');
    if (allowed.includes(initial)) {
      viewer.src = `./${initial}`;
      openDirect.href = `./${initial}`;
      tabs.forEach(tab => tab.classList.toggle('active', tab.dataset.page === initial));
    }
    tabs.forEach((tab) => {
      tab.addEventListener("click", () => {
        tabs.forEach((item) => item.classList.remove("active"));
        tab.classList.add("active");
        const page = tab.dataset.page;
        viewer.src = `./${page}`;
        openDirect.href = `./${page}`;
      });
    });
  </script>
</body>
</html>
