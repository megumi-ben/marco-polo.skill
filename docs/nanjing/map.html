<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='12' fill='%231f6049'/%3E%3Cpath d='M33 13 27 29 15 35 21 19Z' fill='white'/%3E%3C/svg%3E">
  <title>南京路线地图 · Marco Polo Demo</title>
  <link rel="stylesheet" href="../vendor/maplibre/maplibre-gl.css">
  <style>
    :root {
      --ink: #17201d;
      --muted: #65706b;
      --paper: #f5efe3;
      --panel: rgba(255, 252, 244, 0.95);
      --line: rgba(23, 32, 29, 0.14);
      --shadow: 0 18px 44px rgba(28, 35, 32, 0.18);
      --day0: #7c5c2e;
      --day1: #00897b;
      --day2: #e4572e;
      --day3: #3f51b5;
      --food: #d58a00;
      --warn: #b4512f;
      --ok: #2b7351;
      --station: #202020;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background: var(--paper);
      font-family: "Avenir Next", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      letter-spacing: 0;
    }

    button {
      border: 0;
      font: inherit;
      letter-spacing: 0;
    }

    .app {
      display: grid;
      grid-template-columns: minmax(360px, 440px) minmax(0, 1fr);
      min-height: 100vh;
      overflow: hidden;
      transition: grid-template-columns 220ms ease;
    }

    .app.sidebar-collapsed {
      grid-template-columns: 0 minmax(0, 1fr);
    }

    aside {
      position: relative;
      z-index: 4;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      max-height: 100vh;
      padding: 22px 20px;
      overflow: hidden;
      border-right: 1px solid var(--line);
      background:
        linear-gradient(145deg, rgba(0, 137, 123, 0.14), transparent 34%),
        linear-gradient(28deg, rgba(228, 87, 46, 0.13), transparent 42%),
        linear-gradient(180deg, rgba(255, 255, 255, 0.78), rgba(255, 249, 238, 0.94));
      box-shadow: var(--shadow);
      transition: transform 220ms ease, opacity 180ms ease;
    }

    .app.sidebar-collapsed aside {
      transform: translateX(-100%);
      opacity: 0;
      pointer-events: none;
    }

    .sidebar-toggle {
      position: fixed;
      z-index: 8;
      left: 376px;
      top: 20px;
      display: grid;
      place-items: center;
      width: 38px;
      height: 38px;
      padding: 0;
      border: 1px solid rgba(23, 32, 29, 0.14);
      border-radius: 50%;
      background: rgba(255, 252, 244, 0.92);
      color: var(--ink);
      box-shadow: 0 12px 26px rgba(21, 31, 27, 0.14);
      backdrop-filter: blur(12px);
      cursor: pointer;
      font-size: 13px;
      font-weight: 900;
      transition: left 220ms ease, transform 160ms ease, background 160ms ease;
    }

    .sidebar-toggle:hover {
      transform: translateY(-1px);
      background: #fff;
    }

    .app.sidebar-collapsed .sidebar-toggle {
      left: 18px;
    }

    .sidebar-toggle .toggle-icon {
      display: inline-block;
      width: 18px;
      text-align: center;
      font-size: 24px;
      line-height: 1;
      transform: translateY(-1px);
    }

    .toggle-text {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }

    .brand {
      padding-bottom: 14px;
      border-bottom: 1px solid var(--line);
    }

    .kicker {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
      color: var(--day0);
      font-size: 12px;
      font-weight: 900;
    }

    .kicker::before {
      content: "";
      flex: 0 0 auto;
      width: 30px;
      height: 3px;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--day0) 0 25%, var(--day1) 25% 50%, var(--day2) 50% 75%, var(--day3) 75% 100%);
      box-shadow: none;
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Songti SC", "SimSun", serif;
      font-size: 34px;
      line-height: 1.05;
      font-weight: 700;
    }

    .summary {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.65;
    }

    .toolbar {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 14px;
    }

    .toolbar button,
    .day-tabs button,
    .utility button {
      min-height: 38px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.78);
      color: var(--ink);
      cursor: pointer;
      font-size: 13px;
      font-weight: 850;
      transition: transform 160ms ease, background 160ms ease, border-color 160ms ease;
    }

    .toolbar button:hover,
    .day-tabs button:hover,
    .utility button:hover {
      transform: translateY(-1px);
      background: #fff;
      border-color: rgba(0, 137, 123, 0.45);
    }

    .day-tabs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 7px;
      margin-top: 14px;
    }

    .day-tabs button.active {
      color: #fff;
      background: var(--ink);
      border-color: var(--ink);
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 14px;
    }

    .stat {
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.64);
    }

    .stat strong {
      display: block;
      font-size: 18px;
      line-height: 1.1;
    }

    .stat span {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.35;
    }

    .timeline {
      flex: 1;
      min-height: 0;
      margin-top: 14px;
      padding-right: 2px;
      overflow: auto;
    }

    .day-block {
      margin-bottom: 16px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.62);
    }

    .day-block.hidden { display: none; }

    .day-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }

    .day-head h2 {
      margin: 0;
      font-size: 16px;
      line-height: 1.35;
    }

    .day-head p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }

    .badge {
      flex: 0 0 auto;
      padding: 5px 8px;
      border-radius: 999px;
      color: #fff;
      font-size: 12px;
      font-weight: 900;
      white-space: nowrap;
    }

    .day0-bg { background: var(--day0); }
    .day1-bg { background: var(--day1); }
    .day2-bg { background: var(--day2); }
    .day3-bg { background: var(--day3); }

    .stop-list {
      display: grid;
      gap: 7px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .stop {
      display: grid;
      grid-template-columns: 34px 1fr;
      gap: 9px;
      align-items: start;
      padding: 10px;
      border: 1px solid rgba(23, 32, 29, 0.10);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.7);
      cursor: pointer;
      transition: transform 150ms ease, box-shadow 150ms ease, border-color 150ms ease;
    }

    .stop:hover,
    .stop.active {
      transform: translateY(-1px);
      border-color: rgba(0, 137, 123, 0.45);
      box-shadow: 0 10px 22px rgba(31, 40, 37, 0.10);
    }

    .num {
      display: grid;
      place-items: center;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      color: #fff;
      font-size: 12px;
      font-weight: 900;
      font-variant-numeric: tabular-nums;
    }

    .day0 .num { background: var(--day0); }
    .day1 .num { background: var(--day1); }
    .day2 .num { background: var(--day2); }
    .day3 .num { background: var(--day3); }
    .num.home { background: var(--ok); }
    .num.station { background: var(--station); }

    .stop-name {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 14px;
      font-weight: 900;
      line-height: 1.3;
    }

    .stop-time {
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
      white-space: nowrap;
    }

    .stop-note {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .map-shell {
      position: relative;
      min-height: 100vh;
      background: #d7dfd8;
    }

    #map {
      position: absolute;
      inset: 0;
    }

    .top-card {
      position: absolute;
      z-index: 3;
      top: 18px;
      left: 18px;
      right: 18px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 14px;
      align-items: center;
      max-width: 820px;
      padding: 14px 16px;
      border: 1px solid rgba(255, 255, 255, 0.72);
      border-radius: 8px;
      background: rgba(255, 252, 244, 0.86);
      box-shadow: 0 14px 32px rgba(21, 31, 27, 0.14);
      backdrop-filter: blur(14px);
      transition: transform 180ms ease, opacity 160ms ease;
    }

    .app.top-collapsed .top-card {
      transform: translateY(calc(-100% - 22px));
      opacity: 0;
      pointer-events: none;
    }

    .floating-control {
      position: absolute;
      z-index: 5;
      display: grid;
      place-items: center;
      width: 38px;
      height: 38px;
      border: 1px solid rgba(23, 32, 29, 0.14);
      border-radius: 50%;
      background: rgba(255, 252, 244, 0.93);
      color: var(--ink);
      box-shadow: 0 12px 26px rgba(21, 31, 27, 0.14);
      backdrop-filter: blur(12px);
      cursor: pointer;
      font-size: 18px;
      font-weight: 950;
      transition: transform 160ms ease, background 160ms ease, opacity 160ms ease;
    }

    .floating-control:hover {
      transform: translateY(-1px);
      background: #fff;
    }

    .top-toggle {
      top: 12px;
      right: 12px;
    }

    .top-close-icon {
      top: -14px;
      right: -14px;
    }

    .detail-toggle {
      right: 18px;
      bottom: 18px;
    }

    .app:not(.top-collapsed) .top-open-icon {
      display: none;
    }

    .app.top-collapsed .top-close-icon {
      display: none;
    }

    .top-card strong {
      display: block;
      font-size: 14px;
      line-height: 1.35;
    }

    .top-card span {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .utility {
      display: flex;
      gap: 8px;
    }

    .detail {
      position: absolute;
      z-index: 3;
      right: 18px;
      bottom: 18px;
      width: min(430px, calc(100% - 36px));
      max-height: min(62vh, 560px);
      overflow: auto;
      border: 1px solid rgba(255, 255, 255, 0.75);
      border-radius: 8px;
      background: rgba(255, 252, 244, 0.94);
      box-shadow: 0 18px 40px rgba(21, 31, 27, 0.18);
      backdrop-filter: blur(16px);
      transition: transform 180ms ease, opacity 160ms ease;
    }

    .detail.empty {
      display: none;
    }

    .app.detail-collapsed .detail:not(.empty) {
      transform: translateY(18px);
      opacity: 0;
      pointer-events: none;
    }

    .app:not(.detail-collapsed) .detail-open {
      display: none;
    }

    .detail-close {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 2;
      width: 28px;
      height: 28px;
      border: 1px solid rgba(23, 32, 29, 0.12);
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.76);
      color: var(--muted);
      cursor: pointer;
      font-size: 17px;
      font-weight: 900;
      line-height: 1;
    }

    .detail-close:hover {
      color: var(--ink);
      background: #fff;
    }

    .detail-header {
      padding: 16px 56px 12px 18px;
      border-bottom: 1px solid var(--line);
    }

    .detail-eyebrow {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 850;
    }

    .detail h3 {
      margin: 8px 0 0;
      font-size: 22px;
      line-height: 1.25;
      font-family: Georgia, "Songti SC", "SimSun", serif;
    }

    .detail-body {
      display: grid;
      gap: 12px;
      padding: 14px 18px 18px;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .chip {
      padding: 5px 8px;
      border-radius: 999px;
      background: rgba(23, 32, 29, 0.08);
      color: var(--ink);
      font-size: 12px;
      font-weight: 850;
    }

    .info-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .info-box {
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.68);
    }

    .info-box label {
      display: block;
      color: var(--muted);
      font-size: 11px;
      font-weight: 850;
      margin-bottom: 4px;
    }

    .info-box div {
      font-size: 13px;
      line-height: 1.45;
      font-weight: 760;
    }

    .paragraph {
      margin: 0;
      color: #2a3531;
      font-size: 13px;
      line-height: 1.7;
    }

    .warning {
      padding: 10px 12px;
      border: 1px solid rgba(180, 81, 47, 0.25);
      border-radius: 8px;
      background: rgba(180, 81, 47, 0.08);
      color: #6d2d1f;
      font-size: 12px;
      line-height: 1.6;
      font-weight: 760;
    }

    .pin-wrap {
      position: relative;
      display: block;
      width: 31px;
      height: 31px;
      transform: none;
      filter: drop-shadow(0 5px 8px rgba(0, 0, 0, 0.18));
      user-select: none;
    }

    .pin {
      position: relative;
      display: grid;
      place-items: center;
      width: 31px;
      height: 31px;
      border: 2px solid currentColor;
      border-radius: 50%;
      background: #fffaf1;
      color: var(--day1);
      box-shadow:
        inset 0 0 0 1px rgba(255, 255, 255, 0.9),
        0 0 0 1px rgba(255, 255, 255, 0.90);
      transform: none;
      font-size: 16px;
      font-weight: 1000;
      font-family: "DIN Alternate", "Avenir Next Condensed", "Arial Narrow", "PingFang SC", sans-serif;
      line-height: 1;
      letter-spacing: 0;
    }

    .pin span {
      transform: none;
      font-variant-numeric: tabular-nums;
      font-weight: 1000;
      -webkit-font-smoothing: antialiased;
      text-rendering: geometricPrecision;
    }

    .pin.meta span {
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      font-size: 13px;
      font-weight: 1000;
    }

    .pin-label {
      position: absolute;
      left: 36px;
      top: 4px;
      max-width: 92px;
      padding: 5px 7px;
      border: 1px solid rgba(255, 255, 255, 0.82);
      border-radius: 8px;
      background: rgba(255, 252, 244, 0.94);
      color: #14201d;
      font-size: 12px;
      font-weight: 900;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      box-shadow: 0 6px 14px rgba(24, 32, 29, 0.14);
      pointer-events: none;
    }

    body.labels-hidden .pin-label {
      opacity: 0;
      visibility: hidden;
      transform: translateX(-4px);
    }

    body:not(.labels-hidden) .pin-label {
      opacity: 1;
      visibility: visible;
      transform: translateX(0);
      transition: opacity 150ms ease, transform 150ms ease, visibility 150ms ease;
    }

    .pin.day0 { color: var(--day0); }
    .pin.day1 { color: var(--day1); }
    .pin.day2 { color: var(--day2); }
    .pin.day3 { color: var(--day3); }
    .pin.home { color: var(--ok); }
    .pin.station { color: var(--station); }
    .pin.active {
      background: #fff;
      box-shadow:
        0 0 0 3px rgba(255, 255, 255, 0.88),
        0 0 0 5px rgba(0, 137, 123, 0.20),
        0 7px 14px rgba(0, 0, 0, 0.18);
    }

    .pin-wrap.active .pin-label {
      border-color: rgba(0, 137, 123, 0.55);
      background: #fff;
      box-shadow: 0 0 0 4px rgba(0, 137, 123, 0.14), 0 10px 22px rgba(24, 32, 29, 0.18);
    }

    .load-state {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      z-index: 1;
      color: var(--muted);
      font-size: 14px;
      text-align: center;
      padding: 24px;
    }

    @media (max-width: 900px) {
      .app {
        display: block;
        min-height: 100vh;
      }

      .app.sidebar-collapsed {
        display: block;
      }

      aside {
        min-height: 0;
        max-height: none;
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      .app.sidebar-collapsed aside {
        display: none;
      }

      .sidebar-toggle,
      .app.sidebar-collapsed .sidebar-toggle {
        left: auto;
        right: 10px;
        top: 10px;
      }

      .brand { padding-right: 32px; }
      .timeline { flex: none; height: 220px; }

      .map-shell {
        min-height: 54vh;
      }

      .top-card {
        top: 10px;
        left: 10px;
        right: 10px;
        grid-template-columns: 1fr;
      }

      .detail {
        left: 10px;
        right: 10px;
        bottom: 10px;
        width: auto;
        max-height: 42vh;
      }

      h1 {
        font-size: 28px;
      }
    }
    #map { z-index: 0; }
    .route-marker { border: 0; background: transparent; width: 31px; height: 31px; padding: 0; cursor: pointer; }
    .maplibregl-canvas { outline: none; }
    .maplibregl-ctrl-attrib { font-size: 10px; }
    @media (max-width: 900px) {
      .map-shell { height: 65vh; min-height: 440px; }
      .top-card { top: 52px; }
      .detail { max-height: 48%; bottom: 36px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <button id="sidebarToggle" class="sidebar-toggle" type="button" aria-expanded="true" aria-controls="timeline">
      <span class="toggle-icon">‹</span>
      <span class="toggle-text">收起行程</span>
    </button>
    <aside>
      <section class="brand">
        <div class="kicker">Nanjing Route Map</div>
        <h1>南京 · 每日路线</h1>
        <p class="summary">从新街口出发，串联钟山、秦淮与城北。历史示例展示路线与时间安排；票价、开放和预约信息需按出行日期重新核验。</p>
        <div class="toolbar">
          <button id="fitAllBtn" type="button">适配当前</button>
          <button id="nextStopBtn" type="button">下一个点</button>
        </div>
        <div class="day-tabs" aria-label="日期筛选">
          <button class="active" type="button" data-filter="all">全部</button>
          <button type="button" data-filter="day0">6/24</button>
          <button type="button" data-filter="day1">6/25</button>
          <button type="button" data-filter="day2">6/26</button>
          <button type="button" data-filter="day3">6/27</button>
        </div>
        <div class="stats">
          <div class="stat"><strong>21</strong><span>已选南京点位</span></div>
          <div class="stat"><strong>3.5天</strong><span>实际游玩时间</span></div>
          <div class="stat"><strong>20:36</strong><span>南京南出发去扬州</span></div>
        </div>
      </section>
      <section id="timeline" class="timeline"></section>
    </aside>

    <main class="map-shell">
      <div id="map"></div>
      <div class="load-state" id="loadState">正在加载南京路线示例...</div>
      <section class="top-card">
        <button id="topToggle" class="floating-control top-toggle top-close-icon" type="button" aria-label="收起顶部说明">×</button>
        <div>
          <strong>路线策略：24日下午前置长江路，钟山单独成天，秦淮夜景放6/26，6/27留给南博和城北线。</strong>
          <span>示例连线表示游览顺序；实际交通需查询步行、公交或驾车路线。</span>
        </div>
        <div class="utility">
          <button type="button" id="focusHotelBtn">回到酒店</button>
          <button type="button" id="focusStationBtn">南京南站</button>
        </div>
      </section>
      <button id="topOpen" class="floating-control top-toggle top-open-icon" type="button" aria-label="展开顶部说明">i</button>
      <button id="detailOpen" class="floating-control detail-toggle detail-open" type="button" aria-label="展开景点详情">i</button>
      <section id="detail" class="detail empty" aria-live="polite"></section>
    </main>
  </div>

  <script src="../vendor/maplibre/maplibre-gl.js"></script>
  <script>
    const days = [
      {
        id: 'day0',
        label: '6/24 周三',
        title: '到达南京，长江路轻量线',
        color: '#7c5c2e',

      return `

          <div class="pin ${markerClass(stop)} ${metaClass} ${active ? 'active' : ''}"><span>${stop.order}</span></div>
          <div class="pin-label" title="${stop.name}">${shortName(stop)}</div>
        </div>
      `;
    }

    function renderTimeline() {
      const root = document.getElementById('timeline');
      root.innerHTML = days.map(day => `
        <article class="day-block ${day.id}" data-day="${day.id}">
          <div class="day-head">
            <div>
              <h2>${day.label} · ${day.title}</h2>
              <p>${day.summary}</p>
            </div>
            <span class="badge ${day.id}-bg">${day.stops.length}点</span>
          </div>
          <ol class="stop-list ${day.id}">
            ${day.stops.map(stop => `
              <li class="stop ${day.id}" data-stop-id="${stop.id}">
                <span class="num ${stop.kind || ''}">${stop.order}</span>
                <span>
                  <span class="stop-name">${stop.name}<em class="stop-time">${stop.time}</em></span>
                  <span class="stop-note">${stop.type} · ${stop.duration}</span>
                </span>
              </li>
            `).join('')}
          </ol>
        </article>
      `).join('');

      root.querySelectorAll('.stop').forEach(item => {
        item.addEventListener('click', () => focusStop(item.dataset.stopId, true));
      });
    }

    function renderDetail(stop) {
      const detail = document.getElementById('detail');
      detail.classList.remove('empty');
      detail.innerHTML = `
        <button class="detail-close" type="button" aria-label="收起景点详情">×</button>
        <div class="detail-header">
          <div class="detail-eyebrow">
            <span>${stop.dayLabel} · ${stop.time}</span>
            <span>${stop.type}</span>
          </div>
          <h3>${stop.name}</h3>
        </div>
        <div class="detail-body">
          <div class="chips">
            <span class="chip">停留：${stop.duration}</span>
            <span class="chip">门票：${stop.ticket}</span>
            <span class="chip">预约：${stop.booking}</span>
          </div>
          <div class="info-grid">
            <div class="info-box">
              <label>开放/交通时间</label>
              <div>${stop.hours}</div>
            </div>
            <div class="info-box">
              <label>现场动作</label>
              <div>${stop.action}</div>
            </div>
          </div>
          <p class="paragraph">${stop.note}</p>
          <div class="warning">餐饮/补给：${stop.food}</div>
        </div>
      `;
      detail.querySelector('.detail-close').addEventListener('click', () => {
        document.querySelector('.app').classList.add('detail-collapsed');
      });
    }

    function setActiveClasses(stopId) {
      document.querySelectorAll('.stop').forEach(el => el.classList.toggle('active', el.dataset.stopId === stopId));
      markers.forEach((marker, id) => {
        const stop = allStops.find(item => item.id === id);
        marker.getElement().innerHTML = markerContent(stop, id === stopId);
        if (id === stopId) {
          marker.getElement().style.zIndex = '220';
        } else {
          marker.getElement().style.zIndex = stop.kind ? '140' : '120';
        }
      });
    }

    function focusStop(stopId, pan) {
      const stop = allStops.find(item => item.id === stopId);
      if (!stop) return;
      if (activeFilter !== 'all' && stop.day !== activeFilter) applyFilter(stop.day);
      activeStopId = stopId;
      setActiveClasses(stopId);
      document.querySelector('.app').classList.remove('detail-collapsed');
      renderDetail(stop);
      if (pan && map) {
        map.flyTo({ center: toMapLngLat(stop), zoom: stop.kind === 'station' ? 13 : 15, duration: 450 });
      }
      const listItem = document.querySelector(`[data-stop-id="${stopId}"]`);
      if (listItem) listItem.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      if (pan && matchMedia('(max-width: 900px)').matches) document.querySelector('.map-shell').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function visibleStops() {
      return activeFilter === 'all' ? allStops : allStops.filter(stop => stop.day === activeFilter);
    }

    function updateLabelVisibility() {
      if (!map) return;
      document.body.classList.toggle('labels-hidden', map.getZoom() < LABEL_ZOOM_THRESHOLD);
    }

    function applyFilter(filter) {
      activeFilter = filter;
      document.querySelectorAll('.day-tabs button').forEach(btn => btn.classList.toggle('active', btn.dataset.filter === filter));
      document.querySelectorAll('.day-block').forEach(block => {
        block.classList.toggle('hidden', filter !== 'all' && block.dataset.day !== filter);
      });
      markers.forEach((marker, id) => {
        const stop = allStops.find(item => item.id === id);
        if (filter === 'all' || stop.day === filter) marker.getElement().style.display = '';
        else marker.getElement().style.display = 'none';
      });
      lines.forEach((line, id) => {
        if (map.getLayer(line)) map.setLayoutProperty(line, 'visibility', filter === 'all' || id === filter ? 'visible' : 'none');
      });
      fitCurrent();
    }

    function fitCurrent() {
      if (!map) return;
      const stops = visibleStops();
      if (!stops.length) return;
      const bounds = new maplibregl.LngLatBounds();
      stops.forEach(stop => bounds.extend(toMapLngLat(stop)));
      map.fitBounds(bounds, { padding: { top: 120, bottom: 65, left: 50, right: 70 }, maxZoom: 13, duration: 0 });
    }

    // The research coordinates are GCJ-02 (Amap). OSM uses WGS84.
    // Iteratively invert the GCJ-02 offset for this public display only.
    function toMapLngLat(stop) {
      const a = 6378245.0;
      const ee = 0.00669342162296594323;
      function forward(lng, lat) {
        const x = lng - 105, y = lat - 35;
        let dy = -100 + 2*x + 3*y + 0.2*y*y + 0.1*x*y + 0.2*Math.sqrt(Math.abs(x));
        let dx = 300 + x + 2*y + 0.1*x*x + 0.1*x*y + 0.1*Math.sqrt(Math.abs(x));
        const waves = (20*Math.sin(6*x*Math.PI) + 20*Math.sin(2*x*Math.PI))*2/3;
        dy += waves + (20*Math.sin(y*Math.PI) + 40*Math.sin(y*Math.PI/3))*2/3;
        dy += (160*Math.sin(y*Math.PI/12) + 320*Math.sin(y*Math.PI/30))*2/3;
        dx += waves + (20*Math.sin(x*Math.PI) + 40*Math.sin(x*Math.PI/3))*2/3;
        dx += (150*Math.sin(x*Math.PI/12) + 300*Math.sin(x*Math.PI/30))*2/3;
        const rad = lat / 180 * Math.PI;
        const magic = 1 - ee * Math.sin(rad)**2;
        return [lng + dx*180/(a/Math.sqrt(magic)*Math.cos(rad)*Math.PI),
          lat + dy*180/((a*(1-ee))/(magic*Math.sqrt(magic))*Math.PI)];
      }
      let lng = stop.lng, lat = stop.lat;
      for (let i = 0; i < 4; i++) {
        const shifted = forward(lng, lat);
        lng -= shifted[0] - stop.lng;
        lat -= shifted[1] - stop.lat;
      }
      return [lng, lat];
    }

    function createMap() {
      const loading = document.getElementById('loadState');
      if (!window.maplibregl) {
        loading.textContent = '地图暂时无法加载，左侧仍可查看行程。请稍后刷新。';
        return;
      }
      try {
        map = new maplibregl.Map({ container: 'map', style: 'https://tiles.openfreemap.org/styles/liberty', center: [118.802, 32.041], zoom: 12, attributionControl: false });
      } catch (error) {
        loading.textContent = '当前浏览器无法显示地图，左侧仍可查看完整行程。';
        return;
      }
      map.addControl(new maplibregl.AttributionControl({ compact: true }), 'bottom-right');
      map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'bottom-right');
      map.addControl(new maplibregl.ScaleControl({ unit: 'metric' }), 'bottom-left');
      map.on('zoomend', updateLabelVisibility);
      map.on('error', () => {
        if (!map.isStyleLoaded()) loading.textContent = '底图暂时无法加载，仍可点击左侧行程查看景点详情。';
      });
      allStops.forEach(stop => {
        const element = document.createElement('button');
        element.type = 'button';
        element.className = 'route-marker';
        element.setAttribute('aria-label', `${stop.dayLabel} ${stop.name}`);
        element.innerHTML = markerContent(stop);
        element.addEventListener('click', () => focusStop(stop.id, false));
        const marker = new maplibregl.Marker({ element, anchor: 'center' }).setLngLat(toMapLngLat(stop)).addTo(map);
        markers.set(stop.id, marker);
      });
      map.on('load', () => {
        days.forEach(day => {
          const id = 'route-' + day.id;
          map.addSource(id, { type: 'geojson', data: { type: 'Feature', properties: {}, geometry: { type: 'LineString', coordinates: day.stops.map(toMapLngLat) } } });
          map.addLayer({ id, type: 'line', source: id, layout: { 'line-join': 'round', 'line-cap': 'round', visibility: activeFilter === 'all' || activeFilter === day.id ? 'visible' : 'none' }, paint: { 'line-color': day.color, 'line-width': 5, 'line-opacity': 0.85 } });
          lines.set(day.id, id);
        });
        loading.style.display = 'none';
        fitCurrent();
        updateLabelVisibility();
      });
      fitCurrent();
      updateLabelVisibility();
    }

    if (matchMedia('(max-width: 900px)').matches) document.querySelector('.app').classList.add('top-collapsed');
    renderTimeline();
    createMap();

    document.querySelectorAll('.day-tabs button').forEach(btn => {
      btn.addEventListener('click', () => applyFilter(btn.dataset.filter));
    });

    document.getElementById('fitAllBtn').addEventListener('click', fitCurrent);
    document.getElementById('focusHotelBtn').addEventListener('click', () => focusStop((visibleStops().find(stop => stop.kind === 'home') || allStops.find(stop => stop.kind === 'home')).id, true));
    document.getElementById('focusStationBtn').addEventListener('click', () => focusStop('d3-9', true));
    document.getElementById('nextStopBtn').addEventListener('click', () => {
      const list = visibleStops();
      if (!list.length) return;
      const currentInVisible = list.findIndex(stop => stop.id === activeStopId);
      const next = list[(currentInVisible + 1 + list.length) % list.length];
      focusStop(next.id, true);
    });

    document.getElementById('sidebarToggle').addEventListener('click', () => {
      const app = document.querySelector('.app');
      const collapsed = app.classList.toggle('sidebar-collapsed');
      const toggle = document.getElementById('sidebarToggle');
      toggle.setAttribute('aria-expanded', String(!collapsed));
      toggle.querySelector('.toggle-icon').textContent = collapsed ? '›' : '‹';
      toggle.querySelector('.toggle-text').textContent = collapsed ? '展开行程' : '收起行程';
      window.setTimeout(() => {
        if (map) {
          map.resize();
          fitCurrent();
        }
      }, 240);
    });

    document.getElementById('topToggle').addEventListener('click', () => {
      document.querySelector('.app').classList.add('top-collapsed');
    });

    document.getElementById('topOpen').addEventListener('click', () => {
      document.querySelector('.app').classList.remove('top-collapsed');
    });

    document.getElementById('detailOpen').addEventListener('click', () => {
      const app = document.querySelector('.app');
      if (activeStopId && document.getElementById('detail').classList.contains('empty')) {
        renderDetail(allStops.find(stop => stop.id === activeStopId));
      }
      app.classList.remove('detail-collapsed');
    });
  </script>
</body>
</html>
