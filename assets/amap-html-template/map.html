<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>马可波罗 · 旅行地图</title>
  <style>
    :root{--ink:#263f3a;--muted:#697671;--paper:#f5f6ef;--line:#dfe5dd;--accent:#b98755}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.65 system-ui,-apple-system,"PingFang SC",sans-serif}
    button{font:inherit;color:inherit;cursor:pointer}button:focus-visible{outline:3px solid #b98755;outline-offset:3px}
    header{height:100px;padding:20px 30px;background:#fff;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:20px}
    .eyebrow{font-size:10px;letter-spacing:3px;color:var(--muted)}h1{margin:0;font-size:27px;letter-spacing:2px}h2{font-size:20px;margin:4px 0 12px}h3{font-size:15px;margin:0}
    p{margin:5px 0;color:var(--muted)}.meta{text-align:right;font-size:13px}.app{display:grid;grid-template-columns:355px minmax(0,1fr);height:calc(100vh - 100px)}
    aside{padding:24px;overflow:auto;border-right:1px solid var(--line)}.notice{padding:12px 14px;background:#ece9dc;border-left:3px solid var(--accent);font-size:12px;margin:16px 0 22px}
    .day{margin:22px 0}.day-head{display:flex;gap:10px;align-items:center;margin-bottom:10px}.badge{background:var(--day);color:#fff;padding:2px 9px;border-radius:5px;font-size:12px;white-space:nowrap}
    .stop{display:flex;align-items:center;width:100%;gap:12px;background:#fff;border:1px solid var(--line);border-radius:12px;text-align:left;padding:14px;margin:8px 0}
    .stop:hover{border-color:var(--day);box-shadow:0 4px 15px #263f3a0c}.num{border-radius:50%;background:var(--day);color:white;min-width:27px;height:27px;text-align:center;line-height:27px;font-size:12px}
    .stop small{display:block;color:var(--muted);font-size:12px}.arrow{margin-left:auto;color:#8f9b92}.day-note{font-size:12px;margin-top:10px}
    #detail{background:#fff;padding:15px;border:1px solid var(--line);border-radius:12px;margin-top:20px;font-size:13px}#detail:empty{display:none}#detail h3{font-size:18px}#detail p{margin-top:8px}
    .map-shell{min-width:0;position:relative;display:flex;flex-direction:column;background:#edf1e6}.controls{background:#fff;padding:12px 20px;display:flex;gap:7px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
    .tab,.fit{border:1px solid var(--line);border-radius:8px;background:white;padding:6px 13px;font-size:13px}.tab[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}.fit{margin-left:auto}
    #map{flex:1;min-height:300px}.legend{background:white;padding:10px 20px;color:var(--muted);font-size:11px;border-top:1px solid var(--line)}
    #status{position:absolute;left:20px;top:76px;max-width:calc(100% - 40px);background:#fffffff2;border:1px solid var(--line);padding:10px 14px;border-radius:8px;font-size:12px;z-index:150}
    .pin-wrap{text-align:center;position:relative}.pin{border:3px solid white;box-shadow:0 2px 9px #263f3a33;background:var(--day);border-radius:50%;color:white;width:34px;height:34px;font:600 13px/28px system-ui}
    .pin-label{position:absolute;left:50%;top:38px;transform:translateX(-50%);background:#fff;padding:3px 8px;white-space:nowrap;font-size:12px;border-radius:5px;box-shadow:0 2px 8px #263f3a20}
    .labels-hidden .pin-label{display:none}.footer{margin-top:25px;padding-top:15px;border-top:1px solid var(--line);font-size:11px;color:var(--muted)}
    @media(max-width:720px){header{height:auto;min-height:100px;padding:18px;align-items:flex-start}h1{font-size:22px}.meta{font-size:11px;max-width:130px}.app{display:flex;flex-direction:column;height:auto}.map-shell{order:0;height:56vh;min-height:380px}aside{order:1;overflow:visible;border-right:0;padding:20px}.controls{padding:10px;gap:5px}.tab,.fit{padding:6px 9px}#status{left:10px;top:72px;font-size:11px}.legend{padding:8px 10px}}
  </style>
</head>
<body class="labels-hidden">
  <header><div><div class="eyebrow">MARCO POLO / TRAVEL PLANNER</div><h1 id="title">旅行地图</h1><p id="subtitle">从想去哪儿，到今天怎么走。</p></div><div class="meta" id="meta"></div></header>
  <div class="app">
    <aside><div class="eyebrow">YOUR JOURNEY</div><h2 id="panel-title">路线总览</h2><div class="notice" id="notice"></div><div id="itinerary"></div><section id="detail" aria-live="polite"></section><div class="footer" id="footer"></div></aside>
    <main class="map-shell" aria-label="旅行地图"><div class="controls" id="controls"></div><div id="map"></div><div id="status" role="status">等待行程数据</div><div class="legend">实线：已查询道路路线　 ·　 虚线：顺序示意　 ·　 箭头：前进方向　 ·　 数字：当天顺序</div></main>
  </div>
  <script>
    // 从已确认的行程数据生成此视图；这里不保存任何示例行程、真实凭据或默认坐标。
    // 数据嵌入 HTML 时将字符串中的 < 转义为 \u003c，避免意外结束 script 标签。
    // days: [{id,label,title,color,note,stops:[{id,name,order,kind,lng,lat,time,
    // duration,aliases,booking,hours,transport,note}],legs:[{from,to,path,verified}]}]
    // stop.id 为此日活动的唯一ID；地点稳定ID可另存 placeId。kind可为stay/food/station。
    // leg.path 为 [经度,纬度] 数组；仅已查询到的道路几何设 verified:true。
    // 不能获得道路几何时只画虚线顺序示意，不把当前路况当作未来保证。
    const TRIP = {
      title: '旅行地图', subtitle: '由已确认的行程生成', meta: '',
      notice: '尚未填入行程数据。此文件是地图骨架，不是已经完成的旅行方案。',
      footer: '预约、酒店和交通状态以当前行程文件为准。', days: []
    };
    const $ = id => document.getElementById(id);
    const esc = value => String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    const palette = ['#b7794e','#4f7c6c','#607fa0','#8672a5'];
    const validPoint = s => Number.isFinite(s.lng) && Number.isFinite(s.lat) && Math.abs(s.lng)<=180 && Math.abs(s.lat)<=90;
    const days = TRIP.days.map((day,i)=>({...day,color:/^#[0-9a-f]{6}$/i.test(day.color || '')?day.color:palette[i%palette.length]}));
    const stops = days.flatMap(day=>(day.stops || []).map((stop,i)=>({...stop,order:stop.order ?? i+1,day:day.id,dayLabel:day.label,color:day.color})));
    const located = stops.filter(validPoint);
    let map, AMapRef, activeDay='all';
    const markers = new Map(), lines=[];
    $('title').textContent=TRIP.title; document.title=TRIP.title+' · 马可波罗';
    $('subtitle').textContent=TRIP.subtitle; $('meta').textContent=TRIP.meta;
    $('notice').textContent=TRIP.notice; $('footer').textContent=TRIP.footer;

    function renderList(){
      $('panel-title').textContent=activeDay==='all'?'路线总览':(days.find(d=>d.id===activeDay)?.title || '当日路线');
      $('itinerary').innerHTML=days.filter(d=>activeDay==='all'||d.id===activeDay).map(day=>
        `<section class="day" style="--day:${day.color}"><div class="day-head"><span class="badge">${esc(day.label)}</span><h3>${esc(day.title)}</h3></div>`+
        stops.filter(s=>s.day===day.id).map(s=>`<button class="stop" data-stop="${esc(s.id)}"><span class="num">${esc(s.kind==='stay'?'⌂':s.kind==='station'?'站':s.kind==='food'?'食':s.order)}</span><span><strong>${esc(s.name)}</strong><small>${esc(s.time)} · ${esc(s.duration || '停留待定')}</small></span><span class="arrow">↗</span></button>`).join('')+
        `<p class="day-note">${esc(day.note)}</p></section>`).join('');
      document.querySelectorAll('[data-stop]').forEach(b=>b.addEventListener('click',()=>focusStop(b.dataset.stop)));
    }
    function showDetail(stop){
      const aliases=Array.isArray(stop.aliases)?stop.aliases.join('、'):'';
      $('detail').innerHTML=`<div class="eyebrow">${esc(stop.dayLabel)} / ${esc(stop.time)}</div><h3>${esc(stop.name)}</h3>`+
        (aliases?`<p>别名：${esc(aliases)}</p>`:'')+
        `<p>停留：${esc(stop.duration || '待定')}<br>开放：${esc(stop.hours || '待核验')}<br>预约：${esc(stop.booking || '待核验')}</p>`+
        `<p>${esc(stop.transport || '')}</p><p>${esc(stop.note || '')}</p>`+
        (!validPoint(stop)?'<p>坐标待核验，暂不在地图定位。</p>':'');
    }
    function focusStop(id){
      const stop=stops.find(s=>s.id===id); if(!stop)return;
      showDetail(stop);
      if(map && validPoint(stop)){map.setZoomAndCenter(15,[stop.lng,stop.lat]);map.setPitch(0);map.setRotation(0);}
      if(window.innerWidth<=720) $('detail').scrollIntoView({behavior:'smooth',block:'nearest'});
    }
    function updateLabels(){if(map)document.body.classList.toggle('labels-hidden',map.getZoom()<14);}
    function fit(){
      if(!map)return;
      const items=located.filter(s=>activeDay==='all'||s.day===activeDay).map(s=>markers.get(s.id)).filter(Boolean);
      lines.filter(l=>activeDay==='all'||l.day===activeDay).forEach(l=>items.push(l.overlay));
      if(items.length)map.setFitView(items,false,[75,65,65,65],15);
      map.setPitch(0);map.setRotation(0);updateLabels();
    }
    function filter(day){
      activeDay=day;renderList();$('detail').replaceChildren();
      document.querySelectorAll('[data-day]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.day===day)));
      markers.forEach((m,id)=>{const s=stops.find(s=>s.id===id);day==='all'||s.day===day?m.show():m.hide();});
      lines.forEach(l=>day==='all'||l.day===day?l.overlay.show():l.overlay.hide());fit();
    }
    function loadScript(src){return new Promise((resolve,reject)=>{const s=document.createElement('script');s.src=src;s.onload=resolve;s.onerror=()=>reject(new Error('资源未加载'));document.head.appendChild(s);});}
    async function boot(){
      renderList();
      $('controls').innerHTML='<button class="tab" data-day="all" aria-pressed="true">总览</button>'+days.map(d=>`<button class="tab" data-day="${esc(d.id)}" aria-pressed="false">${esc(d.label)}</button>`).join('')+'<button class="fit" id="fit">适合视野</button>';
      document.querySelectorAll('[data-day]').forEach(b=>b.addEventListener('click',()=>filter(b.dataset.day)));$('fit').addEventListener('click',fit);
      if(!located.length){$('status').textContent='请先填入已确认的行程及高德坐标；地图尚未生成。';return;}
      try{
        $('status').textContent='正在加载高德地图…';
        await loadScript('./config.local.js');
        const c=window.AMAP_LOCAL_CONFIG;
        const configured=v=>typeof v==='string' && v.trim() && !v.startsWith('YOUR_');
        if(!c || !configured(c.jsapiKey) || !(configured(c.serviceHost)||configured(c.securityJsCode)))throw new Error('配置缺失');
        window._AMapSecurityConfig=configured(c.serviceHost)?{serviceHost:c.serviceHost}:{securityJsCode:c.securityJsCode};
        await loadScript('https://webapi.amap.com/loader.js');
        AMapRef=await AMapLoader.load({key:c.jsapiKey,version:'2.0',plugins:['AMap.Scale','AMap.ToolBar']});
        map=new AMapRef.Map('map',{viewMode:'2D',pitch:0,rotation:0,zoom:12,center:[located[0].lng,located[0].lat]});
        map.addControl(new AMapRef.Scale());map.addControl(new AMapRef.ToolBar({position:{right:'16px',top:'16px'}}));
        map.on('zoomend',updateLabels);
        map.on('complete',()=>{updateLabels();$('status').textContent='高德地图 · 北向上 · 点击景点查看详情';});
        located.forEach(s=>{
          const symbol=s.kind==='stay'?'⌂':s.kind==='food'?'食':s.kind==='station'?'站':s.order;
          const m=new AMapRef.Marker({position:[s.lng,s.lat],anchor:'center',title:s.name,content:`<div class="pin-wrap" style="--day:${s.color}"><div class="pin">${esc(symbol)}</div><div class="pin-label">${esc(s.name)}</div></div>`});
          m.on('click',()=>focusStop(s.id));m.setMap(map);markers.set(s.id,m);
        });
        days.forEach(day=>{
          const points=stops.filter(s=>s.day===day.id);
          const legs=day.legs?.length?day.legs:points.slice(1).map((p,i)=>({from:points[i].id,to:p.id,verified:false}));
          legs.forEach(leg=>{
            const from=points.find(p=>p.id===leg.from),to=points.find(p=>p.id===leg.to);
            const real=leg.verified===true && Array.isArray(leg.path) && leg.path.length>1 && leg.path.every(p=>Array.isArray(p)&&validPoint({lng:p[0],lat:p[1]}));
            const path=real?leg.path:(from&&to&&validPoint(from)&&validPoint(to)?[[from.lng,from.lat],[to.lng,to.lat]]:null);
            if(!path)return;
            const overlay=new AMapRef.Polyline({path,strokeColor:day.color,strokeWeight:5,strokeOpacity:.85,strokeStyle:real?'solid':'dashed',showDir:true,isOutline:real,outlineColor:'#ffffff',borderWeight:2,lineJoin:'round'});
            overlay.setMap(map);lines.push({day:day.id,overlay});
          });
        });
        fit();
      }catch{
        $('status').textContent='地图未加载。请检查本地 config.local.js、有效的 JSAPI 安全配置与网络；不要把此状态当作验收成功。';
      }
    }
    boot();
  </script>
</body>
</html>
